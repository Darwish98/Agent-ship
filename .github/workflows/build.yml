name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: mac }
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # There is no plain `dist` script; each platform has its own (dist:mac, dist:win, dist:linux).
      - run: npm run dist:${{ matrix.target }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: agent-ship-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
