<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Ship</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="toolbar">
  <div id="toolbar-title"><span class="brand-mark">&#9733;</span> Agent Ship</div>
  <button id="add-project-btn" class="btn btn-primary">+ Add project</button>
</div>

<div id="ship-scroll">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="space-glow" cx="30%" cy="20%" r="80%">
        <stop offset="0%" stop-color="#1a2340" />
        <stop offset="55%" stop-color="#0a0e1c" />
        <stop offset="100%" stop-color="#040509" />
      </radialGradient>
      <pattern id="stars" width="220" height="220" patternUnits="userSpaceOnUse">
        <circle cx="14" cy="22" r="1.4" fill="#ffffff" opacity="0.85" />
        <circle cx="52" cy="70" r="0.9" fill="#bcd2ff" opacity="0.6" />
        <circle cx="96" cy="18" r="1.1" fill="#ffffff" opacity="0.5" />
        <circle cx="130" cy="55" r="1.6" fill="#ffffff" opacity="0.9" />
        <circle cx="168" cy="30" r="0.8" fill="#bcd2ff" opacity="0.55" />
        <circle cx="190" cy="90" r="1.2" fill="#ffffff" opacity="0.7" />
        <circle cx="30" cy="120" r="1" fill="#ffffff" opacity="0.5" />
        <circle cx="70" cy="150" r="1.5" fill="#bcd2ff" opacity="0.8" />
        <circle cx="110" cy="110" r="0.7" fill="#ffffff" opacity="0.4" />
        <circle cx="150" cy="140" r="1.1" fill="#ffffff" opacity="0.6" />
        <circle cx="200" cy="170" r="1.3" fill="#ffffff" opacity="0.75" />
        <circle cx="40" cy="195" r="0.9" fill="#ffffff" opacity="0.5" />
        <circle cx="180" cy="200" r="1.6" fill="#bcd2ff" opacity="0.85" />
      </pattern>
      <radialGradient id="planet-body" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#6b5aa8" />
        <stop offset="100%" stop-color="#2a2050" />
      </radialGradient>
      <radialGradient id="window-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#5a6d94" />
        <stop offset="100%" stop-color="#1c222c" />
      </radialGradient>
      <radialGradient id="engine-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd9a0" />
        <stop offset="55%" stop-color="#ff8a3d" />
        <stop offset="100%" stop-color="#ff8a3d00" />
      </radialGradient>
      <pattern id="floor-tiles" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#2c3440" />
        <rect width="40" height="40" fill="none" stroke="#37414f" stroke-width="1" />
      </pattern>
      <linearGradient id="hull-panel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#252d3a" />
        <stop offset="100%" stop-color="#161b24" />
      </linearGradient>
      <linearGradient id="hull-armor" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2c3543" />
        <stop offset="100%" stop-color="#1a212b" />
      </linearGradient>
    </defs>

    <g id="space-layer"></g>
    <g id="hull-layer"></g>
    <g id="room-layer"></g>
    <g id="crew-layer"></g>
    <g id="bubble-layer"></g>
  </svg>
</div>

<div id="empty-state">
  No projects in the ship yet.<br/>
  <span>Click <strong>+ Add project</strong> to register one, or run <code>claude</code> inside a registered folder.</span>
</div>

<div id="spawn-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Spawn an agent</h3>
    <div id="spawn-project-name" class="modal-subtitle"></div>
    <label class="modal-field">
      Role
      <input id="spawn-role" type="text" placeholder="e.g. QA Engineer" maxlength="40" />
    </label>
    <label class="modal-field">
      Task
      <textarea id="spawn-task" rows="4" placeholder="What should they work on?"></textarea>
    </label>
    <div id="spawn-error" class="modal-error hidden"></div>
    <div class="modal-actions">
      <button id="spawn-cancel" class="btn">Cancel</button>
      <button id="spawn-submit" class="btn btn-primary">Spawn</button>
    </div>
  </div>
</div>

<script src="characters.js"></script>
<script src="room.js"></script>
</body>
</html>
