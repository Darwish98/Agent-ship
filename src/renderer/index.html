<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Ship</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="toolbar">
  <div id="toolbar-title">
    <span class="brand-mark">
      <svg viewBox="0 0 20 20" width="14" height="14">
        <path d="M10 1 L12 8 L19 10 L12 12 L10 19 L8 12 L1 10 L8 8 Z" fill="#ffffff" />
      </svg>
    </span>
    Agent Ship
  </div>
  <button id="add-project-btn" class="btn btn-primary">
    <svg class="btn-icon" viewBox="-10 -10 20 20" width="12" height="12">
      <path d="M0 -7 V7 M-7 0 H7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
    </svg>
    Add project
  </button>
</div>

<div id="rooms-scroll">
  <div id="building">
    <div id="building-roof"></div>
    <div id="rooms-grid"></div>
  </div>
</div>

<div id="empty-state">
  No rooms in the building yet.<br/>
  <span>Click <strong>+ Add project</strong> to register one, or run <code>claude</code> inside a registered folder.</span>
</div>

<div id="spawn-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Spawn an agent</h3>
    <div id="spawn-project-name" class="modal-subtitle"></div>
    <label class="modal-field">
      Role
      <input id="spawn-role" type="text" placeholder="e.g. QA Engineer" maxlength="40" />
    </label>
    <label class="modal-field">
      Task
      <textarea id="spawn-task" rows="4" placeholder="What should they work on?"></textarea>
    </label>
    <div id="spawn-error" class="modal-error hidden"></div>
    <div class="modal-actions">
      <button id="spawn-cancel" class="btn">Cancel</button>
      <button id="spawn-submit" class="btn btn-primary">Spawn</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="characters.js"></script>
<script src="room.js"></script>
</body>
</html>
