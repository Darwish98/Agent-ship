<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Ship</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="floor-tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2c3440" />
      <rect width="40" height="40" fill="none" stroke="#37414f" stroke-width="1" />
    </pattern>
    <radialGradient id="window-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a4a63" />
      <stop offset="100%" stop-color="#1c222c" />
    </radialGradient>
  </defs>

  <rect width="1000" height="700" fill="#0d1016" />

  <rect x="20" y="20" width="960" height="660" rx="18" fill="#1c222c" />
  <rect x="34" y="34" width="932" height="632" rx="12" fill="url(#floor-tiles)" />

  <line x1="353" y1="34" x2="353" y2="666" stroke="#111419" stroke-width="4" />
  <line x1="666" y1="34" x2="666" y2="666" stroke="#111419" stroke-width="4" />

  <g>
    <text x="60" y="66" class="room-label">Engine room</text>
    <circle cx="290" cy="90" r="26" fill="url(#window-glow)" stroke="#4d5868" stroke-width="2" />
    <rect x="60" y="520" width="120" height="70" rx="6" fill="#3a4452" stroke="#4d5868" stroke-width="1.5" />
    <rect x="72" y="532" width="96" height="28" rx="3" fill="#7f77dd" opacity="0.35" />
    <circle cx="82" cy="576" r="5" fill="#5dcaa5" />
    <circle cx="98" cy="576" r="5" fill="#f0997b" />
    <circle cx="114" cy="576" r="5" fill="#f4f1ea" opacity="0.4" />
  </g>

  <g>
    <text x="373" y="66" class="room-label">Lab</text>
    <circle cx="603" cy="90" r="26" fill="url(#window-glow)" stroke="#4d5868" stroke-width="2" />
    <rect x="440" y="520" width="140" height="70" rx="6" fill="#3a4452" stroke="#4d5868" stroke-width="1.5" />
    <rect x="452" y="532" width="116" height="18" rx="3" fill="#d85a30" opacity="0.35" />
    <rect x="452" y="554" width="55" height="24" rx="3" fill="#4d5868" />
    <rect x="513" y="554" width="55" height="24" rx="3" fill="#4d5868" />
  </g>

  <g>
    <text x="686" y="66" class="room-label">Bridge</text>
    <circle cx="916" cy="90" r="26" fill="url(#window-glow)" stroke="#4d5868" stroke-width="2" />
    <rect x="760" y="510" width="180" height="80" rx="8" fill="#3a4452" stroke="#4d5868" stroke-width="1.5" />
    <rect x="774" y="522" width="152" height="34" rx="3" fill="#1d9e75" opacity="0.3" />
    <circle cx="790" cy="572" r="5" fill="#5dcaa5" />
    <circle cx="806" cy="572" r="5" fill="#378add" />
    <circle cx="822" cy="572" r="5" fill="#f4f1ea" opacity="0.4" />
  </g>

  <g id="bubble-layer"></g>
  <g id="crew-layer"></g>
</svg>

<div id="empty-state">
  Waiting for Claude Code activity&hellip;<br/>
  <span>Run <code>claude</code> in a project with the hook installed.</span>
</div>
<script src="characters.js"></script>
<script src="room.js"></script>
</body>
</html>
